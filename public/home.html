<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>外部 API 代理测试</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #result-area {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f0f8ff;
            display: none;
            max-width: 400px;
        }
        .label { font-weight: bold; color: #333; }
    </style>
</head>
<body>
<h1>请求外部数据演示</h1>
<p>点击按钮，你的服务器将去请求 jsonplaceholder 的数据并返回。</p>

<button id="fetch-btn">获取外部用户信息</button>

<div id="result-area">
    <p><span class="label">来源:</span> <span id="source" style="color:red"></span></p>
    <p><span class="label">姓名:</span> <span id="name"></span></p>
    <p><span class="label">邮箱:</span> <span id="email"></span></p>
    <p><span class="label">公司:</span> <span id="company"></span></p>
    <p><span class="label">网站:</span> <span id="website"></span></p>
</div>

<script>
    const btn = document.getElementById('fetch-btn');
    const resultArea = document.getElementById('result-area');

    btn.addEventListener('click', async () => {
        // 按钮变更为“加载中...”
        btn.innerText = '加载中...';
        btn.disabled = true;

        try {
            // 请求我们自己的后端接口
            const response = await fetch('/api/external-data');

            if (!response.ok) throw new Error('服务器报错');

            const data = await response.json();

            // 更新 UI
            document.getElementById('source').innerText = data.source;
            document.getElementById('name').innerText = data.name;
            document.getElementById('email').innerText = data.email;
            document.getElementById('company').innerText = data.company;
            document.getElementById('website').innerText = data.website;

            resultArea.style.display = 'block';

        } catch (error) {
            alert('请求失败，请检查控制台');
            console.error(error);
        } finally {
            // 恢复按钮状态
            btn.innerText = '获取外部用户信息';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
